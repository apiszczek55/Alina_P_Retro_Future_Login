<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <title>Retro Future Login</title>
        <style>
            *{
                margin:0;
                padding:0;
                box-sizing: border-box;
                font-variant: small-caps;
                font-family: arial, sans-serif;
                text-transform: uppercase;
                color: whitesmoke;
            }
            .container{
                background-image: url("background.jpg");
                background-size: cover;
                width: 100vw;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .login{
                padding: 10px 25px;
                display: block;
                width: 320px;
                height:500px;
                border:2px solid #73e4ca;
                border-radius: 20px;
                background-image: linear-gradient(140deg,#151C2F,#293752);
                box-shadow: 0px 0px 7px rgba(0, 0, 0, 0.301) inset,
                0 0 20px rgba(0, 0, 0, 0.452);
            }
            h1{
                font-family: verdana, sans-serif;
                text-align: center;
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            }
            i{
                font-style: normal;
                background-image: linear-gradient(to right, #DA4BE0,#6ADBFB);
                background-clip: text;
                color: transparent;
                text-shadow: 0 0 15px #db4be0bd;
            }
            img[alt=logo]{
                display: block;
                margin: 10px auto;
            }
            p{
                margin: 0 auto 15px;
                display: block;
                text-align: center;
                font-size: 0.9rem;
                font-weight: bold;
                text-transform: lowercase;
            }
            input{
                font-size: 0.9rem;
                font-weight: bold;
                text-transform: lowercase;
                border:1.8px solid rgba(255, 255, 255, 0.2);
                background-color: #2E3749;
                border-radius: 10px;
                width: 100%;
                height: 40px;
                margin-bottom: 15px;
            }
            input::placeholder{
                padding-left:5px;
                color: #9A9DA7;
            }
            input[type=checkbox]{
                margin: 0 5px 0 0;
                width:auto;
                height: auto;
                appearance: none;
                width:15px;
                height: 15px;
                border-radius: 2px;
            }
            label{
                font-size: 0.8rem;
                font-weight: bold;
                text-transform: lowercase;
                display: inline-flex;
                justify-content: left;
                align-items: center;
                margin-bottom: 15px;
            }
            input[type=submit]{
                border: none;
                background-image: linear-gradient(60deg, #DA4BE0,#8B6FF5,#7989F7,#6ADBFB);
            }
            input[type=submit]:hover,input[type=submit]:active{
                cursor: pointer;
                box-shadow: 0 0 10px rgba(0,0,0, 0.4);
                background-image: linear-gradient(60deg, #e054e4,#957bf4,#8494ff,#95e5fc);
            }
            button{
                margin: 15px auto;
                background-color: #2E3749;
                border:1.8px solid rgba(255, 255, 255, 0.2);
                border-radius: 10px;
                display: inline-flex;
                justify-content: center;
                column-gap: 5px;
                align-items: center;
                width: 130px;
                height: 40px;
            }
            button:hover,button:active{
                cursor:pointer;
                background-color: #3d4961;
                box-shadow: 0 0 10px rgba(0,0,0, 0.4);
            }
            span{
                font-size: 0.8rem;
                font-weight: bold;
                text-transform: lowercase;
            }
            a{
                color: #F533FE;
                text-decoration: none;
                font-size: 0.8rem;
                font-weight: bold;
                text-transform: lowercase;
            }
            form{
                position: relative;
            }
            .rec{
                position: absolute;
                right:0;
                display: inline-block;
            }
            .divider{
                display: flex;
                align-items: center;
                text-align: center;
                margin:0 auto;
            }
            .divider span{
                padding: 0 10px;
            }
            .divider:before,.divider::after{
                content: "";
                flex:1;
                border: 0.1px solid #95e6fc3f;
            }
        </style>
    </head>
    <body>
        <div class="container">
        <div class="login">
            <img width="50px" height="auto" src="logo.png" alt="logo">
            <h1>FUTURE <i>NET</i></h1>
            <p>Access the digital millenium</p>
            <form action="#" method="post">
                <input type="email" name="emailaddr" id="emailaddr" placeholder="email adress">
                <input type="password" name="password" id="password" placeholder="password">
                <label><input type="checkbox" name="remsess" id="remsess"> Remember session</label>
            <a href="#" class="rec">Recover access</a>
                <input type="submit" value="Enter the future">
            </form>
            <div class="divider">
                <span>Or connect via</span>
            </div>
            <button type="button">
                <img src="icons8-github-64.png" alt="" aria-hidden="true" width="25px" height="auto">
                <span>Github</span>
            </button>
            <button type="button">
                <img src="icons8-google-64.png" alt="" aria-hidden="true" width="25px" height="auto">
                <span>Google</span>
            </button>
            <p>New to the future? <a href="#">Join now</a></p>
        </div>
        </div>
    </body>
</html>
